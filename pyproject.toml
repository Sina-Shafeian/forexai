[project]
name = "forexai"
version = "0.1.0"
description = "Forex analysis, explainable signals, and opt-in Demo-only MT5 execution"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "MetaTrader5==5.0.5735; sys_platform == 'win32'",
    "httpx>=0.28,<1",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pandas-ta==0.4.71b0",
    "pyarrow>=19,<24",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-telegram-bot>=22.8,<23",
    "PyYAML>=6,<7",
    "scipy>=1.15,<2",
]

[project.scripts]
forexai = "forexai.cli:main"

[project.entry-points.pytest11]
forexai-runtime-paths = "forexai.pytest_runtime"

[dependency-groups]
dev = [
    "hypothesis>=6.130,<7",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forexai"]

[tool.uv]
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
cache_dir = ".pytest_runtime_${FOREXAI_PYTEST_ID}_cache"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["forexai"]
branch = true
